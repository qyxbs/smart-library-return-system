<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1024, initial-scale=1.0, user-scalable=no">
<title>智能书架 - 管理端</title>
<style>
:root {
  --bg: #151d2b; --surface: #1d2535; --border: #2d3545;
  --text: #e6edf3; --muted: #8b949e; --dim: #5a6370;
  --green: #3fb950; --blue: #58a6ff; --orange: #d2991d; --red: #f85149;
  --green-bg: #16301a; --blue-bg: #0d2847; --orange-bg: #332314; --red-bg: #310e0e;
  --radius: 12px; --gap: 14px;
  --header-h: 48px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;background:var(--bg);color:var(--text);
  width:1024px;height:600px;overflow:hidden;display:flex;flex-direction:column;}
body.login-page{justify-content:center;align-items:center}

/* ====== Header ====== */
.header{background:var(--surface);padding:0 20px;display:flex;justify-content:space-between;
  align-items:center;border-bottom:1px solid var(--border);min-height:var(--header-h);flex-shrink:0}
.header h1{font-size:18px;font-weight:600}
.header-right{display:flex;align-items:center;gap:12px;font-size:13px}
.back-btn{color:var(--muted);cursor:pointer;font-size:20px;padding:4px 10px;border-radius:8px;
  background:var(--border);border:none}
.back-btn:hover{color:#fff;background:#3a3d4a}
.user-badge{color:var(--blue);background:var(--blue-bg);padding:3px 12px;border-radius:12px;font-size:12px}
.clock{color:var(--dim);font-size:12px}
.logout-btn{color:var(--red);cursor:pointer;font-size:12px;padding:4px 10px;border-radius:6px;
  background:transparent;border:1px solid var(--red);margin-left:4px}
.logout-btn:hover{background:var(--red-bg)}

/* ====== Content area ====== */
.content{flex:1;overflow-y:auto;padding:var(--gap)}
.page{display:none;height:100%}
.page.active{display:block}

/* ====== Login Page ====== */
.login-wrap{text-align:center}
.login-wrap h2{font-size:28px;margin-bottom:8px;color:#f0f6fc}
.login-wrap .sub{color:var(--muted);font-size:14px;margin-bottom:60px}
.voice-btn{width:220px;height:220px;border-radius:50%;border:3px solid var(--green);
  background:var(--green-bg);color:var(--green);font-size:28px;font-weight:700;
  cursor:pointer;transition:all .2s;position:relative}
.voice-btn:hover{transform:scale(1.05);box-shadow:0 0 40px rgba(46,160,67,.3)}
.voice-btn:active{transform:scale(.95)}
.voice-btn.recording{border-color:var(--orange);color:var(--orange);background:var(--orange-bg);
  animation:pulse .8s infinite}
.voice-btn.processing{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
@keyframes pulse{0%,100%{box-shadow:0 0 10px rgba(210,153,29,.3)}50%{box-shadow:0 0 30px rgba(210,153,29,.6)}}
.voice-btn .icon{font-size:48px;display:block;margin-bottom:4px}
.voice-status{margin-top:16px;font-size:14px;color:var(--muted);min-height:24px}
.manual-hint{position:fixed;right:12px;bottom:8px;color:#2a2d3a;font-size:11px;cursor:pointer}
.manual-hint:hover{color:var(--muted)}
.manual-dialog{display:none;position:fixed;inset:0;background:var(--bg);z-index:100;
  flex-direction:column;justify-content:center;align-items:center}
.manual-dialog.show{display:flex}
.manual-dialog h3{font-size:22px;margin-bottom:24px}
.manual-dialog input{width:280px;padding:12px 16px;margin:6px 0;border:1px solid var(--border);
  border-radius:10px;background:var(--surface);color:var(--text);font-size:16px;outline:none}
.manual-dialog input:focus{border-color:var(--blue)}
.manual-dialog button{width:280px;padding:12px;margin-top:16px;border:none;border-radius:10px;
  font-size:16px;font-weight:600;cursor:pointer}
.manual-login-btn{background:var(--blue);color:#fff}
.manual-login-btn:hover{opacity:.85}
.manual-cancel{background:transparent;color:var(--muted);margin-top:8px;font-size:14px}
.manual-err{color:var(--red);font-size:13px;margin-top:8px;min-height:20px}

/* ====== Main page 6 buttons ====== */
.main-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);
  gap:var(--gap);height:100%;padding:8px}
.main-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;transition:all .15s;gap:8px}
.main-card:hover{background:#222636;border-color:#4a4d5a;transform:translateY(-2px)}
.main-card .ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#fff}
.main-card .lb{font-size:18px;font-weight:600}
.main-card .desc{font-size:12px;color:var(--muted);text-align:center;padding:0 16px}

/* ====== Shelf page ====== */
.shelf-grid-wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.shelf-layer-label{grid-column:1/-1;font-size:13px;color:var(--muted);padding:4px 0 0 0;
  border-top:1px solid var(--border);margin-top:6px}
.shelf-layer-label:first-child{border:none;margin-top:0}
.slot{border-radius:10px;background:var(--surface);border:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;transition:all .15s;position:relative;height:105px;overflow:hidden}
.slot:hover{border-color:var(--blue);background:#1e2333}
.slot .coord{font-size:11px;color:var(--dim);position:absolute;top:4px;left:8px}
.slot .s-title{font-size:12px;font-weight:600;text-align:center;padding:0 4px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:100%}
.slot .s-cat{font-size:10px;color:var(--muted);margin-top:1px}
.slot.status-3{border-color:var(--green);background:var(--green-bg)}
.slot.status-1{border-color:var(--blue);background:var(--blue-bg)}
.slot.status-2{border-color:var(--orange);background:var(--orange-bg)}
.slot.status-0{border-color:var(--dim);background:transparent}
.slot.status-None{border-color:var(--border);background:transparent}
.search-row{display:flex;gap:8px;margin-bottom:12px}
.search-row input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:10px;
  background:var(--surface);color:var(--text);font-size:15px;outline:none}
.search-row input:focus{border-color:var(--blue)}
.search-row button{padding:10px 20px;border:none;border-radius:10px;background:var(--blue);
  color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.shelf-detail{display:none;margin-top:8px;padding:14px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius)}
.shelf-detail.show{display:block}
.shelf-detail .d-title{font-size:16px;font-weight:600;margin-bottom:6px}
.shelf-detail .d-meta{font-size:12px;color:var(--muted);margin-bottom:10px}
.shelf-detail button{padding:8px 18px;margin-right:8px;border:none;border-radius:8px;
  font-size:14px;font-weight:600;cursor:pointer}
.btn-retrieve{background:var(--blue);color:#fff}

/* ====== Voice entry ====== */
.voice-entry{display:flex;flex-direction:column;align-items:center;padding-top:30px;gap:16px}
.voice-entry .big-mic{width:140px;height:140px;border-radius:50%;border:3px solid var(--green);
  background:var(--green-bg);color:var(--green);font-size:22px;font-weight:700;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.voice-entry .big-mic .ico{font-size:36px}
.voice-entry .big-mic:hover{transform:scale(1.05)}
.voice-entry .big-mic.recording{border-color:var(--orange);color:var(--orange);
  background:var(--orange-bg);animation:pulse .8s infinite}
.voice-entry .big-mic.processing{border-color:var(--blue);color:var(--blue);
  background:var(--blue-bg)}
.voice-result{margin-top:8px;padding:14px 20px;background:var(--surface);border-radius:var(--radius);
  border:1px solid var(--border);text-align:center;min-width:320px;display:none}
.voice-result.show{display:block}
.voice-result .vr-title{font-size:20px;font-weight:700;margin:6px 0}
.voice-result .vr-cat{font-size:14px;color:var(--blue)}
.voice-result button{margin-top:12px;padding:10px 32px;border:none;border-radius:10px;
  font-size:15px;font-weight:600;cursor:pointer}
.btn-print{background:var(--green);color:#fff;margin-right:8px}
.btn-retry{background:var(--border);color:var(--text)}
.manual-entry{margin-top:20px;padding:16px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);display:flex;flex-direction:column;gap:8px;width:360px}
.manual-entry h4{font-size:14px;color:var(--muted)}
.manual-entry input,.manual-entry select{padding:8px 12px;border:1px solid var(--border);
  border-radius:8px;background:var(--bg);color:var(--text);font-size:14px}
.manual-entry button{padding:8px;border:none;border-radius:8px;background:var(--blue);
  color:#fff;font-size:14px;font-weight:600;cursor:pointer}

/* ====== Book/User/Log list ====== */
.filter-row{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.filter-row select,.filter-row input{padding:8px 12px;border:1px solid var(--border);
  border-radius:8px;background:var(--surface);color:var(--text);font-size:14px}
.filter-row input{flex:1}
.item-list{display:flex;flex-direction:column;gap:6px;max-height:440px;overflow-y:auto}
.item-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;font-size:13px}
.item-row .i-title{font-weight:600;font-size:14px}
.item-row .i-meta{color:var(--muted);font-size:11px}
.item-row .i-actions{display:flex;gap:6px}
.item-row .i-actions button{padding:4px 12px;border:none;border-radius:6px;font-size:12px;cursor:pointer}
.btn-edit{background:var(--blue-bg);color:var(--blue)}
.btn-del{background:var(--red-bg);color:var(--red)}
.btn-promote{background:var(--blue-bg);color:var(--blue)}
.btn-freeze{background:var(--orange-bg);color:var(--orange)}
.page-nav{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:12px}
.page-nav button{padding:6px 14px;border:1px solid var(--border);border-radius:8px;
  background:var(--surface);color:var(--text);cursor:pointer;font-size:13px}
.page-nav span{font-size:13px;color:var(--muted)}

/* ====== Task page ====== */
.task-current{padding:14px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);margin-bottom:12px}
.task-current .tc-label{font-size:12px;color:var(--muted);margin-bottom:4px}
.task-current .tc-name{font-size:18px;font-weight:700}
.prio-tag{padding:2px 8px;border-radius:4px;font-size:11px;margin-left:8px}
.prio-1{background:var(--red-bg);color:var(--red)}
.prio-2{background:var(--blue-bg);color:var(--blue)}
.prio-3{background:var(--border);color:var(--text)}
.task-item{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;font-size:13px}
.log-list{display:flex;flex-direction:column;gap:2px;max-height:420px;overflow-y:auto}
.log-item{display:flex;gap:10px;padding:5px 14px;font-size:12px;border-bottom:1px solid var(--border)}
.log-item .ltime{color:var(--dim);white-space:nowrap}
.log-item .lmsg{color:var(--muted)}

/* ====== System page ====== */
.sys-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--gap)}
.sys-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.sys-card h3{font-size:15px;margin-bottom:10px}
.sys-card .sys-val{font-size:24px;font-weight:700;margin-bottom:6px}
.sys-card .sys-val.ok{color:var(--green)}
.sys-card .sys-val.err{color:var(--red)}
.sys-card button{padding:8px 20px;border:none;border-radius:8px;font-size:13px;font-weight:600;
  cursor:pointer;margin-right:8px;margin-top:6px}
.btn-test{background:var(--blue);color:#fff}
.btn-refresh{background:var(--border);color:var(--text)}

/* ====== Tabs ====== */
.tabs{display:flex;gap:4px;margin-bottom:12px}
.tab-btn{padding:6px 18px;border:1px solid var(--border);border-radius:8px;
  background:transparent;color:var(--muted);cursor:pointer;font-size:13px}
.tab-btn.active{background:var(--blue-bg);color:var(--blue);border-color:var(--blue)}

/* ====== Virtual Keyboard ====== */
.kb-wrap{position:fixed;bottom:0;left:0;width:1024px;z-index:999;display:none}
.kb-wrap.on{display:block}
.kb-cand-row{display:flex;gap:4px;padding:4px 8px;min-height:38px;align-items:center;
  flex-wrap:wrap;background:#0d1117;border-bottom:1px solid var(--border)}
.kb-cand{background:var(--surface);color:var(--text);border:1px solid var(--border);
  padding:5px 12px;border-radius:6px;font-size:18px;cursor:pointer;min-width:36px;text-align:center}
.kb-cand:active{background:var(--blue);color:#fff}
.kb-pinyin{font-size:18px;color:var(--green);padding:2px 10px;min-height:24px;font-family:monospace;background:#0d1117}
.kb-rows{background:#0d1117;padding:2px 6px 4px 6px;border-top:2px solid var(--blue)}
.kb-row{display:flex;gap:3px;margin-bottom:3px;justify-content:center}
.kb-row:last-child{margin-bottom:0}
.kb-key{background:var(--surface);color:var(--text);border:1px solid var(--border);
  border-radius:6px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:18px;height:42px;min-width:40px;flex:1;user-select:none;
  -webkit-tap-highlight-color:transparent}
.kb-key:active{background:var(--blue-bg);border-color:var(--blue)}
.kb-key.w2{flex:1.5}
.kb-key.w4{flex:3}
.kb-key.w6{flex:5}
.kb-key.mod{background:var(--border);color:var(--muted);font-size:12px;font-weight:600}
.kb-key.mod.on{background:var(--blue-bg);color:var(--blue);border-color:var(--blue)}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);padding:10px 24px;
  border-radius:8px;font-size:14px;font-weight:600;z-index:300;pointer-events:none;
  opacity:0;transition:opacity .3s}
.toast.ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green);opacity:1}
.toast.err{background:var(--red-bg);color:var(--red);border:1px solid var(--red);opacity:1}
</style>
</head>
<body class="login-page">

<!-- ==================== LOGIN PAGE ==================== -->
<div id="login-page" style="display:flex;flex-direction:column;align-items:center">
  <h2 style="font-size:32px;margin-bottom:4px;color:#f0f6fc">智能书架</h2>
  <p style="color:var(--muted);font-size:14px;margin-bottom:50px">声纹验证解锁管理功能</p>
  <button class="voice-btn" id="login-voice-btn" onclick="voiceLogin()">
    <span class="icon">🎤</span>声纹解锁
  </button>
  <div class="voice-status" id="login-status"></div>
  <span class="manual-hint" onclick="showManualLogin()">手动登录</span>
</div>

<div class="manual-dialog" id="manual-dialog">
  <h3>手动登录</h3>
  <input type="text" id="ml-user" placeholder="用户名 / OpenID" onclick="this.focus();KB.target=this;KB.show()" onfocus="KB.target=this;KB.show()">
  <input type="password" id="ml-pin" placeholder="管理员 PIN" onclick="this.focus();KB.target=this;KB.show()" onfocus="KB.target=this;KB.zh=false;KB.pinyin='';KB.cands=[];KB.lastChar='';KB.upPinyin();KB.upCand();KB.render();KB.show()">
  <div class="manual-err" id="ml-err"></div>
  <button class="manual-login-btn" onclick="manualLogin()">登录</button>
  <button class="manual-cancel" onclick="hideManualLogin()">返回</button>
</div>

<!-- ==================== MAIN APP ==================== -->
<div id="app" style="display:none;width:100%;height:100%;flex-direction:column">
  <div class="header">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="back-btn" id="back-btn" onclick="goMain()">←</button>
      <h1 id="page-title">智能书架</h1>
    </div>
    <div class="header-right">
      <span class="clock" id="clock"></span>
      <span class="user-badge" id="user-badge"></span>
      <button class="logout-btn" onclick="logout()">退出</button>
    </div>
  </div>
  <div class="content" id="content">

    <!-- ===== MAIN ===== -->
    <div class="page active" id="page-main">
      <div class="main-grid">
        <div class="main-card" onclick="goPage('shelf')"><span class="ic" style="background:#58a6ff"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2"><rect x="2" y="2" width="9" height="9" rx="1.5"/><rect x="13" y="2" width="9" height="9" rx="1.5"/><rect x="2" y="13" width="9" height="9" rx="1.5"/><rect x="13" y="13" width="9" height="9" rx="1.5"/></svg></span><span class="lb">书架看板</span><span class="desc">16 格实时状态 · 快捷取书</span></div>
        <div class="main-card" onclick="goPage('voice')"><span class="ic" style="background:#3fb950"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2"><rect x="9" y="1" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="23"/><line x1="9" y1="23" x2="15" y2="23"/></svg></span><span class="lb">语音录入</span><span class="desc">说书名→分类→打印标签</span></div>
        <div class="main-card" onclick="goPage('books')"><span class="ic" style="background:#d2991d"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M4 19.5V5a2 2 0 0 1 2-2h14v16H6.5A2.5 2.5 0 0 0 4 19.5z"/></svg></span><span class="lb">书籍管理</span><span class="desc">浏览 · 搜索 · 编辑 · 删除</span></div>
        <div class="main-card" onclick="goPage('users')"><span class="ic" style="background:#a371f7"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M1 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/><circle cx="17" cy="9" r="3"/><path d="M19 16h3a3 3 0 0 1 3 3v2"/></svg></span><span class="lb">用户管理</span><span class="desc">列表 · PIN · 冻结 · 统计</span></div>
        <div class="main-card" onclick="goPage('tasks')"><span class="ic" style="background:#f0883e"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1.5" fill="#fff" stroke="none"/><circle cx="4" cy="12" r="1.5" fill="#fff" stroke="none"/><circle cx="4" cy="18" r="1.5" fill="#fff" stroke="none"/></svg></span><span class="lb">任务监控</span><span class="desc">机械爪队列 · 操作日志</span></div>
        <div class="main-card" onclick="goPage('system')"><span class="ic" style="background:#8b949e"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v3m0 16v3M4.22 4.22l2.12 2.12m11.32 11.32l2.12 2.12M1 12h3m16 0h3M4.22 19.78l2.12-2.12m11.32-11.32l2.12-2.12"/></svg></span><span class="lb">系统工具</span><span class="desc">设备状态 · 测试工具</span></div>
      </div>
    </div>

    <!-- ===== 1. SHELF ===== -->
    <div class="page" id="page-shelf">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <div style="display:flex;gap:8px">
          <button id="btn-start-shelve" style="background:var(--green);color:#fff;padding:6px 16px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer" onclick="startAdminShelve()">📥 开始上架</button>
          <span id="shelve-status" style="font-size:12px;color:var(--muted);padding:4px 0"></span>
        </div>
        <button style="background:var(--border);color:var(--muted);padding:4px 12px;border:none;border-radius:6px;font-size:12px;cursor:pointer" onclick="loadShelf()">刷新</button>
      </div>
      <div class="shelf-grid-wrap" id="shelf-grid"></div>
      <div class="shelf-detail" id="shelf-detail"></div>
    </div>

    <!-- ===== 2. VOICE ===== -->
    <div class="page" id="page-voice">
      <div class="voice-entry">
        <button class="big-mic" id="voice-mic-btn" onclick="voiceEntry()">
          <span class="ico">🎤</span>说书名
        </button>
        <div style="color:var(--muted);font-size:13px">点击说出书名即可</div>
        <div class="voice-result" id="voice-result"></div>
        <span style="color:#2a2d3a;font-size:10px;cursor:pointer;margin-top:30px" onclick="showManualEntry()">手动录入</span>
        <div class="manual-dialog" id="manual-entry-dlg">
          <h3>手动录入</h3>

          <div class="sys-val" id="sys-vp" style="font-size:12px">—</div>

<div class="kb-wrap" id="kb-wrap">
  <div class="kb-pinyin" id="kb-pinyin"></div>

<script>
// ===================== GLOBALS =====================
const API = '';

let curPage = 'main', adminName = '', authToken = '', adminUserId = 0;

const S = {1:'已借出',2:'未上架',3:'在架'};
const CATS = ['教辅','文学','科技','其他'];

function $(id){return document.getElementById(id)}

function toast(msg,ok){const t=$('toast');t.textContent=msg;t.className='toast '+(ok?'ok':'err');
  clearTimeout(t._tid);t._tid=setTimeout(()=>t.className='toast',2200)}

async function api(url,opts={}){
  const headers={'Content-Type':'application/json'};
  if(authToken) headers['Authorization']='Bearer '+authToken;
  if(opts.headers){Object.assign(headers,opts.headers);delete opts.headers;}
  const r=await fetch(API+url,{headers,...opts});
  if(!r.ok){const t=await r.text();throw new Error(r.status+' '+t)}
  return r.json()
}

async function apiSilent(url,opts={}){
  try{return await api(url,opts)}catch(e){return {code:-1,message:e.message}}
}

setInterval(()=>{const e=$('clock');if(e){const d=new Date();const utc8=new Date(d.getTime()+8*3600000);e.textContent=utc8.toISOString().slice(11,19)}},1000)

// ===================== LOGIN =====================
async function voiceLogin(){
  const btn=$('login-voice-btn'),st=$('login-status');
  btn.classList.add('recording');btn.innerHTML='<span class="icon">🎤</span>录音中...';
  st.textContent='正在声纹验证...';st.style.color='var(--orange)';
  // 3s 录音结束后切换到"识别中"
  const aiTimer=setTimeout(()=>{btn.classList.remove('recording');btn.classList.add('processing');btn.innerHTML='<span class="icon">🔍</span>识别中...'},3000);
  try{
    const r=await fetch('/api/voice/analog-record',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({duration:3,login_only:true})
    });
    clearTimeout(aiTimer);
    const j=await r.json();
    if(!j.ok){st.textContent=j.error||'验证失败';st.style.color='var(--red)';}
    else{
      st.textContent='✓ 声纹通过，查找账户...';st.style.color='var(--green)';
      adminName=j.speaker;
      const linked=await linkSpeakerToToken(j.speaker);
      if(!linked){
        st.textContent='未找到管理员账户「'+j.speaker+'」，请手动登录或注册声纹';
        st.style.color='var(--red)';
        return
      }
      st.textContent='✓ 欢迎 '+j.speaker;st.style.color='var(--green)';
      setTimeout(enterApp,400)
    }
  }catch(e){clearTimeout(aiTimer);st.textContent='连接失败，请手动登录';st.style.color='var(--red)'}
  btn.classList.remove('recording','processing');btn.innerHTML='<span class="icon">🎤</span>声纹解锁'
}

async function linkSpeakerToToken(speakerName){
  // 声纹验证即管理员鉴权——能通过声纹就是管理员
  // 自动查找或创建用户，并提升为 admin
  try{
    // 1. 查找已有用户 (任意 role)
    const r=await apiSilent('/api/users/page',{method:'POST',body:JSON.stringify({page:1,size:100})});
    if(r.code===200){
      const users=r.data.records||r.data.list||r.data||[];
      const match=users.find(u=>
        (u.nickname||'').toLowerCase()===(speakerName||'').toLowerCase()||
        (u.openid||'').toLowerCase()===(speakerName||'').toLowerCase());
      if(match){
        authToken='local_'+match.openid;
        // 如果不是 admin，自动提升
        if(match.role!==1){
          await apiSilent('/api/users/promote',{method:'POST',
            body:JSON.stringify({userId:match.user_id||match.id, pin:'123456'})});
        }
        return true
      }
    }
  }catch(e){console.log('linkSpeakerToToken search:',e)}
  // 2. 用户不存在——创建并提升为 admin
  try{
    const lr=await apiSilent('/api/users/login',{method:'POST',
      body:JSON.stringify({code:speakerName,nickname:speakerName})});
    if(lr.code===200&&lr.data&&lr.data.token){
      authToken=lr.data.token;
      // 获取 user_id 并提升为 admin
      const me=await apiSilent('/api/users/me');
      if(me.code===200&&me.data){
        const uid=me.data.user_id||me.data.id;
        await apiSilent('/api/users/promote',{method:'POST',
          body:JSON.stringify({userId:uid, pin:'123456'})});
      }
      return true
    }
  }catch(e){console.log('linkSpeakerToToken create:',e)}
  authToken='';return false
}

function showManualLogin(){$('manual-dialog').classList.add('show');$('ml-err').textContent='';$('ml-user').focus()}
function hideManualLogin(){$('manual-dialog').classList.remove('show');KB.hide()}

async function manualLogin(){
  const name=$('ml-user').value.trim(),pin=$('ml-pin').value.trim();
  if(!name||!pin){$('ml-err').textContent='请填写用户名和 PIN';return}
  try{
    const r=await fetch(API+'/api/users/login',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code:name,nickname:name})});
    const j=await r.json();
    if(j.code!==200){$('ml-err').textContent=j.message||'登录失败';return}
    authToken=j.data.token;
    const me=await fetch(API+'/api/users/me',{
      headers:{'Authorization':'Bearer '+authToken}}).then(r=>r.json());
    if(me.code!==200){$('ml-err').textContent='获取用户信息失败';return}
    // Verify PIN via promote endpoint
    const verify=await fetch(API+'/api/users/promote',{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+authToken},
      body:JSON.stringify({userId:me.data.user_id,pin:pin})});
    const vj=await verify.json();
    if(vj.code!==200){$('ml-err').textContent='PIN 错误或权限不足';authToken='';return}
    adminName=me.data.nickname||name;
    adminUserId=me.data.user_id;
    $('ml-err').textContent='';hideManualLogin();enterApp();
  }catch(e){$('ml-err').textContent='连接失败: '+e.message}
}

function enterApp(){
  KB.hide();
  document.body.classList.remove('login-page');
  $('login-page').style.display='none';$('manual-dialog').classList.remove('show');
  $('app').style.display='flex';$('user-badge').textContent=adminName||'管理员';
  $('back-btn').style.display='none';goMain();
  // 云端 AI 链: 仅预热 ASR（无需预热 LLM）
  fetch('/api/voice/preload',{method:'POST'}).catch(()=>{});
}

function logout(){
  KB.hide();
  document.body.classList.add('login-page');
  $('login-page').style.display='flex';$('app').style.display='none';
  adminName='';authToken='';curPage='main';
  $('login-voice-btn').classList.remove('recording','processing');
  $('login-voice-btn').innerHTML='<span class="icon">🎤</span>声纹解锁';
  $('login-status').textContent=''
}

// ===================== NAVIGATION =====================
function goPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  $('page-'+name).classList.add('active');
  curPage=name;$('back-btn').style.display='block';
  $('page-title').textContent={shelf:'书架看板',voice:'语音录入',books:'书籍管理',users:'用户管理',tasks:'任务监控',system:'系统工具'}[name];
  if(name==='shelf')loadShelf();
  else if(name==='books')loadBooks();
  else if(name==='users')loadUsers();
  else if(name==='tasks')loadTasks();
  else if(name==='system')refreshSystem();
  else if(name==='voice'){
    const r=$('voice-result');if(r){r.classList.remove('show');r.innerHTML='';}
    const b=$('voice-mic-btn');if(b){b.classList.remove('recording','processing');b.innerHTML='<span class="ico">🎤</span>说书名';}
  }
}

function goMain(){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  $('page-main').classList.add('active');
  curPage='main';$('back-btn').style.display='none';$('page-title').textContent='智能书架';
}

// ===================== 1. SHELF =====================
async function loadShelf(){
  try{
    const [sr,br]=await Promise.all([
      api('/api/storage-slot/list',{method:'POST',body:'{}'}),
      api('/api/book-instance/shelf')
    ]);
    if(sr.code!==200){toast('加载书架失败',false);return}
    const slots=sr.data||[],books=(br.code===200?br.data:[])||[];
    // Map slot_id → book
    const bySlot={};for(const b of books)bySlot[b.slot_id]=b;
    let html='<div class="shelf-layer-label">二层 · 科技(21-24) + 其他(25-28)</div>';
    const layer2=slots.filter(s=>s.coord_y>=21&&s.coord_y<=28).sort((a,b)=>a.coord_y-b.coord_y);
    for(const s of layer2)html+=slotHtml(s,bySlot[s.slot_id]);
    html+='<div class="shelf-layer-label">一层 · 文学(11-14) + 教辅(15-18)</div>';
    const layer1=slots.filter(s=>s.coord_y>=11&&s.coord_y<=18).sort((a,b)=>a.coord_y-b.coord_y);
    for(const s of layer1)html+=slotHtml(s,bySlot[s.slot_id]);
    $('shelf-grid').innerHTML=html;$('shelf-detail').classList.remove('show');
  }catch(e){toast('加载书架失败',false)}
}

function slotHtml(slot,book){
  const has=!!book;
  const status=has?book.status:'None';
  const title=has?(book.title||'书#'+book.instance_id):'空';
  const cat=has?(book.category||''):'';
  return `<div class="slot status-${status}" onclick="slotClick(${slot.coord_y},'${has?book.instance_id:'0'}')">
    <span class="coord">${slot.coord_y}</span>
    <span class="s-title">${title}</span>
    ${cat?`<span class="s-cat">${cat}</span>`:''}
    <span style="font-size:10px;color:var(--dim)">${S[status]||'空位'}</span>
  </div>`;
}

async function slotClick(coord,iid){
  if(!iid||iid==='0'){$('shelf-detail').classList.remove('show');return}
  try{
    const r=await api('/api/book-instance/'+iid);
    if(r.code!==200){toast('获取详情失败',false);return}
    const d=r.data;
    let btns='';
    if(d.status===3){ // 在架: 可取书下架
    } else if(d.status===2){ // 未上架: 可上架
      btns=`<button style="background:var(--green);color:#fff;padding:8px 18px;margin-right:8px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer" onclick="shelveOneBook('${d.instance_id}','${(d.title||'').replace(/'/g,"\\'")}')">📥 上架</button>`;
    }
    $('shelf-detail').innerHTML=`<div class="d-title">${d.title||'未知'}</div>
      <div class="d-meta">坐标 ${coord} · ${d.category||''} · ${S[d.status]||''}</div>${btns}`;
    $('shelf-detail').classList.add('show');
  }catch(e){toast('获取详情失败',false)}
}

// 管理员单本上架 (UART 直控，K230 #2 未上线时的方案)
async function shelveOneBook(iid,title){
  toast(`正在上架《${title}》...`,true);
  const r=await api('/api/book-instance/admin-shelve',{method:'POST',body:JSON.stringify({instanceId:iid})});
  toast(r.code===200?`《${title}》上架完成 ✓`:(r.message||'失败'),r.code===200);
  setTimeout(loadShelf,600);
}

// 管理员单本下架 (UART 直控)
async function unshelveBook(iid,title){
  if(!confirm(`确认下架《${title}》？`))return;
  const r=await api('/api/book-instance/admin-unshelve',{method:'POST',body:JSON.stringify({instanceId:iid})});
  toast(r.code===200?`《${title}》已下架 ✓`:(r.message||'失败'),r.code===200);
  setTimeout(loadShelf,600);
}

// 管理员批量上架: 整书区推书 → K230 #1 扫码 → 循环上架
let shelvePollTimer=null;
async function startAdminShelve(){
  const btn=$('btn-start-shelve'),st=$('shelve-status');
  if(shelvePollTimer){toast('上架流程已在运行中',false);return;}
  btn.disabled=true;btn.textContent='⏳ 正在上架...';btn.style.background='var(--orange)';
  st.textContent='启动中...';
  try{
    const r=await api('/api/admin/start-shelve',{method:'POST',body:'{}'});
    if(r.code!==200){toast(r.message||'启动失败',false);btn.disabled=false;btn.textContent='📥 开始上架';btn.style.background='var(--green)';st.textContent='';return}
    st.textContent='整书区推书中... 等待 K230 扫码上架';
    shelvePollTimer=setInterval(pollShelveStatus,2000);
  }catch(e){
    toast('启动失败: '+e.message,false);
    btn.disabled=false;btn.textContent='📥 开始上架';btn.style.background='var(--green)';st.textContent='';
  }
}

async function pollShelveStatus(){
  try{
    const r=await api('/api/admin/shelve-status');
    if(r.code!==200)return;
    const d=r.data||{};
    const st=$('shelve-status');
    if(d.state==='idle'){
      st.textContent=`上架完成 ✓ (共 ${d.total_books||0} 本)`;
      const btn=$('btn-start-shelve');
      btn.disabled=false;btn.textContent='📥 开始上架';btn.style.background='var(--green)';
      if(shelvePollTimer){clearInterval(shelvePollTimer);shelvePollTimer=null;}
      setTimeout(loadShelf,500);
    } else if(d.current_book){
      st.textContent=`上架中: 《${d.current_book}》 (${d.processed||0}/${d.total_books||'?'})`;
    } else {
      st.textContent=`上架进行中... 已处理 ${d.processed||0} 本`;
    }
  }catch(e){}
}

// ===================== 2. VOICE ENTRY =====================
async function voiceEntry(){
  const btn=$('voice-mic-btn'),res=$('voice-result');
  btn.classList.add('recording');btn.innerHTML='<span class="ico">🎤</span>录音中...';res.classList.remove('show');
  // 5s 录音结束后切换到"识别中"
  const aiTimer=setTimeout(()=>{btn.classList.remove('recording');btn.classList.add('processing');btn.innerHTML='<span class="ico">🔍</span>识别中...'},5000);
  try{
    const r=await fetch('/api/voice/analog-record',{
      method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({duration:5,skip_voiceprint:true})});
    clearTimeout(aiTimer);
    const j=await r.json();
    btn.classList.remove('recording','processing');btn.innerHTML='<span class="ico">🎤</span>说书名';
    if(!j.ok){
      res.innerHTML=`<div style="color:var(--red);margin-bottom:8px">${j.error||'识别失败'}</div>
        <button class="btn-retry" onclick="voiceEntry()" style="margin-top:6px">重试</button>`;
      res.classList.add('show');return
    }
    res.innerHTML=`<div class="vr-title">《${j.title||'—'}》</div><div class="vr-cat">${j.category||'—'}</div>
      <button class="btn-print" onclick="printLabel('${(j.title||'').replace(/'/g,"\\'")}','${(j.category||'').replace(/'/g,"\\'")}')" style="margin-top:12px">打印标签</button>
      <button class="btn-retry" onclick="voiceEntry()">重试</button>`;
    res.classList.add('show');
  }catch(e){clearTimeout(aiTimer);btn.classList.remove('recording','processing');btn.innerHTML='<span class="ico">🎤</span>说书名';toast('语音录入失败: '+e.message,false)}
}

async function printLabel(title,cat){
  const r=await api('/api/book/add',{method:'POST',body:JSON.stringify({title, category:cat})});
  if(r.code===200){
    toast('标签打印中 ✓  下一步：贴码 → 到扫码区上架',true);
  }else{toast(r.message||'失败',false)}
}

function showManualEntry(){$('manual-entry-dlg').classList.add('show');$('me-title').focus()}
function hideManualEntry(){$('manual-entry-dlg').classList.remove('show');KB.hide()}
async function manualAddBook(){
  const title=$('me-title').value.trim(),cat=$('me-cat').value;
  if(!title){toast('请输入书名',false);return}
  const r=await api('/api/book/add',{method:'POST',body:JSON.stringify({title, category:cat})});
  if(r.code===200){toast('录入成功 ✓',true);$('me-title').value='';hideManualEntry()}
  else toast(r.message||'失败',false)
}

// ===================== 3. BOOKS =====================
let bookPage=1,bookTotal=0,bookTotalPages=1;
async function loadBooks(page){
  if(page!==undefined)bookPage=page;
  const kw=$('book-search-kw').value.trim(),st=$('book-filter-status').value;
  let r;
  if(kw)r=await api('/api/book/search?keyword='+encodeURIComponent(kw));
  else r=await api('/api/book-instance/page',{method:'POST',
    body:JSON.stringify({page:bookPage,size:20,status:st||undefined})});
  if(r.code!==200||!r.data){$('book-list').innerHTML='<div style="color:var(--muted);padding:20px">暂无数据</div>';$('book-pager').innerHTML='';return}

      ${b.due_date?`<span class="i-meta" style="color:${isOverdue?'var(--red)':'var(--muted)'}"> · ${isOverdue?'⚠️ 逾期':'应还:'}${b.due_date}</span>`:''}</div>

      </div></div>`;
  }
  $('book-list').innerHTML=html||'<div style="color:var(--muted);padding:20px">暂无数据</div>';

  if(!kw&&bookTotalPages>1){
    let ph=`<button onclick="loadBooks(1)" ${bookPage<=1?'disabled':''}>«</button>

async function loadTasks(){

      <div style="font-size:13px;color:var(--muted);margin-bottom:8px">排队: ${(q.tasks||[]).length} 个</div><div class="item-list">`;

    }

async function loadQrTasks(){
  try{
    const r=await api('/api/task/list');
    if(r.code!==200){$('qrtask-list').innerHTML='<div style="color:var(--muted);padding:20px">暂无 QR 任务</div>';return}
    const tasks=r.data||[];
    if(!tasks.length){$('qrtask-list').innerHTML='<div style="color:var(--muted);padding:20px">暂无 QR 任务</div>';return}
    let html='';
    const stMap={pending:'⏳ 待扫码',processing:'🔄 执行中',done:'✅ 已完成',failed:'❌ 失败',expired:'⏰ 已过期'};
    const actMap={borrow:'借书',return:'还书'};
    for(const t of tasks){
      const st=stMap[t.status]||t.status;
      const act=actMap[t.action]||t.action;
      const payload=t.payload||{};
      const ids=payload.instanceId||(payload.instanceIds||[]).join(',')||'—';
      const stColor=t.status==='done'?'var(--green)':t.status==='failed'?'var(--red)':t.status==='expired'?'var(--dim)':'var(--orange)';
      html+=`<div class="task-item"><div>
        <span>${act}</span><span class="prio-tag" style="background:transparent;color:${stColor}">${st}</span>
        <span class="i-meta"> · 书:${ids} · 用户:${t.user_id||'—'}</span>
        <span class="i-meta"> · ${(t.created_at||'').slice(0,16)}</span></div>
        ${t.result?.message?`<span style="font-size:11px;color:var(--muted)">${t.result.message.slice(0,30)}</span>`:''}
      </div>`;
    }
    $('qrtask-list').innerHTML=html;
  }catch(e){$('qrtask-list').innerHTML='<div style="color:var(--red);padding:20px">加载失败</div>'}
}
async function loadLogs(){

// ===================== VIRTUAL KEYBOARD =====================
const KB = {
  target: null, shift: false, zh: false,
  pinyin: '', cands: [], lastChar: '',

  get visible() { return $('kb-wrap').classList.contains('on'); },

  _L: { // layouts
    abc: [['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l'],
          ['⇧','z','x','c','v','b','n','m',',','.','⌫'],['123','中','________________']],
    ABC: [['Q','W','E','R','T','Y','U','I','O','P'],['A','S','D','F','G','H','J','K','L'],
          ['⇧','Z','X','C','V','B','N','M',',','.','⌫'],['123','中','________________']],
    num: [['1','2','3','4','5','6','7','8','9','0'],['@','#','$','%','&','*','-','+','=','/'],
          ['.',',','!','?',':',';','\'','"','_','⌫'],['abc','中','________________']]
  },

  init() { this.render(); },

  show() { $('kb-wrap').classList.add('on'); },
  hide() {
    $('kb-wrap').classList.remove('on');
    this.pinyin = ''; this.cands = []; this.lastChar = ''; this.zh = false; this.shift = false;
    this.upCand(); this.upPinyin(); this.render();
  },

  render() {
    const mode = (this.zh || this.shift) ? 'ABC' : 'abc';
    let lay;
    if (this.shift) lay = this._L.ABC;
    else if (!this.zh && this.shift) lay = this._L.ABC;  // unreachable but safe
    else lay = this._L.abc;

    const rows = $('kb-rows');
    rows.innerHTML = lay.map(row => {
      return '<div class="kb-row">' + row.map(k => {
        let cls = 'kb-key';
        if (k === '________________') cls += ' w6';
        else if (k === '⌫') cls += ' w2';
        else if (k === '⇧') cls += this.shift ? ' w2 mod on' : ' w2 mod';
        else if (k === '123' || k === 'abc') cls += ' w2 mod';
        else if (k === '中') cls += this.zh ? ' w2 mod on' : ' w2 mod';
        const label = k === '________________' ? '空格' : k;
        return `<div class="${cls}" data-k="${k}">${label}</div>`;
      }).join('') + '</div>';
    }).join('');

    // Attach event listeners
    rows.querySelectorAll('.kb-key').forEach(el => {
      el.addEventListener('click', () => this.press(el.dataset.k));
      el.addEventListener('touchend', (e) => { e.preventDefault(); this.press(el.dataset.k); });
    });
  },

  press(key) {
    // Mode switches
    if (key === '123') { this.shift = false; this.zh = false; this._setMode('num'); return; }
    if (key === 'abc') { this.shift = false; this.zh = false; this._setMode('abc'); return; }
    if (key === '中') { this.zh = !this.zh; this.shift = false; this.pinyin = ''; this.cands = []; this.upPinyin(); this.upCand(); this.render(); return; }
    if (key === '⇧') { this.shift = !this.shift; this.render(); return; }

    if (!this.target) return;

    // Pinyin mode
    if (this.zh && /^[a-zA-Z]$/.test(key)) {
      this.pinyin += key.toLowerCase(); this.upPinyin(); this.fetchCand(); return;
    }
    if (this.zh && key === '⌫') {
      if (this.pinyin) { this.pinyin = this.pinyin.slice(0, -1); this.upPinyin(); this.fetchCand(); }
      else this._bs();
      return;
    }
    if (this.zh && key === '________________') {
      if (this.pinyin && this.cands.length > 0) { this._commit(0); return; }
      if (this.pinyin) { this._type(this.pinyin); this.pinyin = ''; this.cands = []; this.upPinyin(); this.upCand(); }
      return;
    }

    // Normal mode
    if (key === '⌫') { this._bs(); return; }
    if (key === '________________') { this._type(' '); return; }
    this._type(key);
  },

  _setMode(m) {
    if (m === 'num') {
      const rows = $('kb-rows');
      rows.innerHTML = this._L.num.map(row => {
        return '<div class="kb-row">' + row.map(k => {
          let cls = 'kb-key';
          if (k === '________________') cls += ' w6';
          else if (k === '⌫') cls += ' w2';
          else if (k === 'abc' || k === '中') cls += ' w2 mod';
          else if (k === '.' || k === ',') cls += ' w2';
          const label = k === '________________' ? '空格' : k;
          return `<div class="${cls}" data-k="${k}">${label}</div>`;
        }).join('') + '</div>';
      }).join('');
      rows.querySelectorAll('.kb-key').forEach(el => {
        el.addEventListener('click', () => this.press(el.dataset.k));
        el.addEventListener('touchend', (e) => { e.preventDefault(); this.press(el.dataset.k); });
      });
    } else {
      this.render();
    }
  },

  _type(t) {
    // Clear word association if typing non-Chinese
    if (!this.zh && t.length === 1 && !('一' <= t && t <= '鿿')) this.lastChar = '';
    const el = this.target;
    const s = el.selectionStart || 0, e = el.selectionEnd || 0, v = el.value || '';
    el.value = v.slice(0, s) + t + v.slice(e);
    el.selectionStart = el.selectionEnd = s + t.length;
    el.focus();
    el.dispatchEvent(new Event('input', { bubbles: true }));
    if (this.shift) { this.shift = false; this.render(); }
  },

  _bs() {
    this.lastChar = ''; // backspace breaks word context
    const el = this.target;
    const s = el.selectionStart || 0, e = el.selectionEnd || 0, v = el.value || '';
    if (s !== e) { el.value = v.slice(0, s) + v.slice(e); el.selectionStart = el.selectionEnd = s; }
    else if (s > 0) { el.value = v.slice(0, s - 1) + v.slice(s); el.selectionStart = el.selectionEnd = s - 1; }
    el.focus();
    el.dispatchEvent(new Event('input', { bubbles: true }));
  },

  async fetchCand() {
    if (!this.pinyin) { this.cands = []; this.upCand(); return; }
    try {
      let url = '/api/ime/pinyin?q=' + encodeURIComponent(this.pinyin);
      if (this.lastChar) url += '&prev=' + encodeURIComponent(this.lastChar);
      const r = await fetch(url);
      const j = await r.json();
      if (j.code === 200 && j.candidates) { this.cands = [...j.candidates]; this.upCand(); }
    } catch (e) {}
  },

  upCand() {
    const el = $('kb-cand-row');
    if (!this.cands.length) { el.innerHTML = ''; return; }
    el.innerHTML = this.cands.map((c, i) =>
      `<span class="kb-cand" data-ci="${i}">${c}</span>`).join('');
    el.querySelectorAll('.kb-cand').forEach(c => {
      c.addEventListener('click', () => this._commit(parseInt(c.dataset.ci)));
    });
  },

  upPinyin() { $('kb-pinyin').textContent = this.pinyin || ''; },

  _commit(i) {
    if (i >= 0 && i < this.cands.length) {
      this._type(this.cands[i]);
      this.lastChar = this.cands[i];
    }
    this.pinyin = ''; this.cands = [];
    // Defer DOM clear so the click event's closest() still finds #kb-wrap
    setTimeout(() => { this.upPinyin(); this.upCand(); }, 0);
  }
};

KB.init();

// Focus: reliably switch KB.target when any input in a dialog gains focus
// (touchscreen tap may not always fire 'click' on the input; 'focusin' always fires)
document.addEventListener('focusin', function(e) {
  if (!KB.visible) return;
  var inp = e.target.closest('input');
  if (inp && inp.offsetParent !== null) { // any visible input
    if (KB.target !== inp) {
      KB.target = inp;
      if (inp.type === 'password') { KB.zh = false; KB.pinyin = ''; KB.cands = []; KB.lastChar = ''; KB.upPinyin(); KB.upCand(); KB.render(); }
    }
  }
});

// Pointer: most reliable touch event for any visible input
document.addEventListener('pointerdown', function(e) {
  var inp = e.target.closest('input');
  if (!inp || inp.offsetParent === null) return;
  inp.focus();
  KB.target = inp;
  if (inp.type === 'password') { KB.zh = false; KB.pinyin = ''; KB.cands = []; KB.lastChar = ''; KB.upPinyin(); KB.upCand(); KB.render(); }
  KB.show();
});

// Global: hide keyboard when tapping outside keyboard + outside inputs
document.addEventListener('click', function(e) {
  if (!KB.visible) return;
  // Tap on keyboard or candidate → keep
  if (e.target.closest('#kb-wrap')) return;
  // Tap on any visible input → keep keyboard (focusin already switched target)
  var inp = e.target.closest('input');
  if (inp && inp.offsetParent !== null) return;
  // Tap on dialog background or anything else → hide
  KB.hide();
});
</script>
